[package]
name = "x-twitter-mcp"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server for X (Twitter): 10 grouped tools, 69 actions. Posts, timelines, users, Lists, Spaces, trends, DMs, media upload and image/video viewing. One static binary."
license = "MIT"
repository = "https://github.com/EL4CTEO/x-mcp"
homepage = "https://github.com/EL4CTEO/x-mcp#readme"
readme = "README.md"
keywords = ["mcp", "twitter", "x", "ai-agents", "llm"]
categories = ["command-line-utilities", "api-bindings"]
include = ["/src/**/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]
default-run = "x-mcp"

[[bin]]
name = "x-mcp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
httpdate = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "multipart", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "fs", "time", "net", "sync", "signal"] }
tokio-util = { version = "0.7", default-features = false }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
